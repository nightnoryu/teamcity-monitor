services:
  teamcity-monitor-ingress:
    image: traefik:v3.7
    container_name: teamcity-monitor-ingress
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      teamcity-monitor-backend:
        condition: service_healthy
      teamcity-monitor-web:
        condition: service_healthy

  teamcity-monitor-backend:
    build: backend
    container_name: teamcity-monitor-backend
    restart: unless-stopped
    environment:
      TEAMCITY_MONITOR_SERVE_REST_ADDRESS: :8080
      TEAMCITY_MONITOR_CONFIG_PATH: /app/config.toml
      TEAMCITY_MONITOR_POLL_INTERVAL: 20s
      TEAMCITY_MONITOR_INSECURE_SKIP_TLS_VERIFY: false
    volumes:
      - "./backend/bin/teamcity-monitor:/app/bin/teamcity-monitor:ro"
      - "./config.toml:/app/config.toml:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tcm-api.rule=Host(`teamcity-monitor.lan`) && PathPrefix(`/api`)"
      - "traefik.http.services.tcm-api.loadbalancer.server.port=8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/resilience/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  teamcity-monitor-web:
    build: web
    container_name: teamcity-monitor-web
    restart: unless-stopped
    volumes:
      - "./web:/app"
      - "/app/node_modules"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tcm-web.rule=Host(`teamcity-monitor.lan`)"
      - "traefik.http.services.tcm-web.loadbalancer.server.port=3000"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/" ]
      interval: 5s
      timeout: 5s
      retries: 5
