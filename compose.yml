services:
  teamcity-monitor-backend:
    build: backend
    container_name: teamcity-monitor-backend
    restart: unless-stopped
    volumes:
      - "./backend/bin/teamcity-monitor:/app/bin/teamcity-monitor:ro"
    ports:
      - "127.0.0.1:8080:8080"

  teamcity-monitor-web:
    build: web
    container_name: teamcity-monitor-web
    restart: unless-stopped
    volumes:
      - "./web:/app"
      - "/app/node_modules"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - teamcity-monitor-backend
