[tools]
go = "1.26"
golangci-lint = "2.12.2"
node = "26"
pnpm = "12"

[env]
GOOS = "linux"
GOARCH = "amd64"
CGO_ENABLED = "0"

[tasks.default]
run = [
    { task = "build" },
    { task = "check" },
]

# Local environment management

[tasks.dev]
depends = [ "backend:build" ]
run = "docker compose up -d --wait"

[tasks."dev:reload"]
depends = [ "backend:build" ]
run = "docker compose restart teamcity-monitor-backend"

[tasks."dev:rebuild"]
depends = [ "backend:build" ]
run = "docker compose up -d --wait --build"

[tasks."dev:down"]
run = "docker compose down"

[tasks."dev:ps"]
run = "docker compose ps"

[tasks."dev:logs"]
run = "docker compose logs -f"

# Builds

[tasks.build]
run = [
    { task = "web:build" },
    { task = "backend:package" },
]

[tasks."backend:package"]
run = '''
backup=$(mktemp)
cp backend/internal/webui/dist/index.html "$backup"
trap 'cp "$backup" backend/internal/webui/dist/index.html; rm -f "$backup"' EXIT
cp -R web/dist/. backend/internal/webui/dist/
mise run backend:build
'''

[tasks."backend:tidy"]
dir = "backend"
run = "go mod tidy"

[tasks."backend:modules"]
dir = "backend"
run = "go mod download"

[tasks."backend:build"]
dir = "backend"
depends = [ "backend:modules" ]
run = """go build \
-trimpath -v \
-o ./bin/teamcity-monitor ./cmd/teamcity-monitor
"""

[tasks."web:modules"]
dir = "web"
run = "pnpm install --frozen-lockfile"

[tasks."web:build"]
dir = "web"
depends = [ "web:modules" ]
run = "pnpm run build"

# Checks

[tasks.check]
run = [
    { task = "test" },
    { task = "lint" },
]

# Tests

[tasks.test]
run = [
    { task = "backend:test" },
    { task = "backend:test:race" },
    { task = "web:test" },
]

[tasks."backend:test"]
dir = "backend"
run = "go test ./..."

[tasks."backend:test:race"]
dir = "backend"
run = "CGO_ENABLED=1 go test -race ./internal/monitor"

[tasks."web:test"]
dir = "web"
run = "pnpm run test"

# Linting

[tasks.lint]
run = [
    { task = "backend:lint" },
    { task = "web:lint" },
]

[tasks."backend:lint"]
dir = "backend"
run = [ "golangci-lint run" ]

[tasks."web:lint"]
dir = "web"
run = [ "pnpm run lint" ]
